<script>document.addEventListener('DOMContentLoaded', () => {
  const navToggle = document.getElementById('navToggle');
  const navLinks = document.getElementById('navLinks');
  const navGroups = document.querySelectorAll('.nav-group');

  // Mobile Menu Toggle
  navToggle.addEventListener('click', () => {
    navLinks.classList.toggle('active');
    navToggle.classList.toggle('active');
    navToggle.setAttribute('aria-expanded', navLinks.classList.contains('active'));
  });

  // Close mobile menu when clicking a link (except dropdown toggles)
  document.querySelectorAll('.nav-link').forEach(link => {
    link.addEventListener('click', (e) => {
      const parent = link.closest('.nav-group');
      
      // If it's a dropdown toggle on mobile
      if (parent && window.innerWidth <= 768) {
        e.preventDefault();
        parent.classList.toggle('active');
      } else if (!parent) {
        // Regular link - close mobile menu
        navLinks.classList.remove('active');
        navToggle.classList.remove('active');
      }
    });
  });

  // Close mobile menu when clicking outside
  document.addEventListener('click', (e) => {
    if (!e.target.closest('.navbar')) {
      navLinks.classList.remove('active');
      navToggle.classList.remove('active');
      navGroups.forEach(group => group.classList.remove('active'));
    }
  });

  // Handle window resize
  let resizeTimer;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      if (window.innerWidth > 768) {
        navLinks.classList.remove('active');
        navToggle.classList.remove('active');
        navGroups.forEach(group => group.classList.remove('active'));
      }
    }, 250);
  });
});
</script>
