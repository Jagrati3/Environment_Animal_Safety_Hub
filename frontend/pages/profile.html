<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>Profile</title>

<link rel="stylesheet" href="profile.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet"/>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>

</head>

<body>

<div class="profile-container">

<!-- Sidebar -->
<div class="profile-sidebar">

<img src="https://cdn.pixabay.com/photo/2015/02/11/13/54/children-632431_1280.jpg" class="profile-pic">

<h2 id="usernameDisplay">Joshi</h2>
<p id="emailDisplay">josh@example.com</p>

<input type="text" id="usernameInput" placeholder="Username">
<input type="email" id="emailInput" placeholder="Email">

<button class="btn edit-btn">Edit Profile</button>
<button class="btn signout-btn">Sign Out</button>
<button class="btn delete-btn">Delete Account</button>

</div>


<!-- Right Section -->

<div class="profile-content">

<div class="tab-navigation">

<button class="tab-btn active" data-tab="badges">Badges</button>
<button class="tab-btn" data-tab="settings">Settings</button>
<button class="tab-btn" data-tab="password">Password</button>

</div>

<div class="tab-content">

<!-- Badges -->

<div id="badges" class="tab-pane active">

<h3>My Badges</h3>

<div class="badge-list">

<img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSUV_PidODE83SO-1cG-DH8P1S9CnPIT-9N-w&s">

</div>

</div>


<!-- Settings -->

<div id="settings" class="tab-pane">

<h3>Account Settings</h3>

<div class="setting-item">
<span>Email Notifications</span>
<input type="checkbox">
</div>

<div class="setting-item">
<span>Dark Mode</span>
<input type="checkbox">
</div>

<div class="setting-item">
<span>Reminders</span>
<input type="checkbox">
</div>

</div>


<!-- Password -->

<div id="password" class="tab-pane">

<h3>Change Password</h3>

<input type="password" placeholder="Current Password">
<input type="password" placeholder="New Password">
<input type="password" placeholder="Confirm Password">

<button class="btn change-password-btn">Change Password</button>

</div>

</div>

</div>

</div>

<script src="profile.js"></script>

</body>
</html>
