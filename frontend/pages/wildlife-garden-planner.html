<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wildlife Garden Planner</title>
  <link rel="stylesheet" href="../css/food-rescue-grid.css">
  <style>
    .plant-card { cursor: pointer; border: 1px solid #ddd; border-radius: 8px; padding: 1rem; margin: 0.5rem; display: inline-block; background: #fff; transition: box-shadow 0.3s; }
    .plant-card.selected { box-shadow: 0 0 8px #4caf50; border-color: #4caf50; }
    .plant-icon { font-size: 2rem; margin-bottom: 0.5rem; }
    .plant-title { font-weight: bold; margin-bottom: 0.25rem; }
    .plant-desc { color: #666; font-size: 0.9rem; }
    #habitatList { margin-top: 2rem; }
    .error { color: red; margin: 1rem; }
  </style>
</head>
<body>
  <header>
    <h1>Wildlife-Friendly Garden Planner</h1>
    <p>Select plants to see habitat tips for your garden.</p>
  </header>
  <main>
    <div id="plantGrid"></div>
    <div id="habitatList"></div>
  </main>
  <script src="wildlife-garden-planner.js"></script>
</body>
</html>
