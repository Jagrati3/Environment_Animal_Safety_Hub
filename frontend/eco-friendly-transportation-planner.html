<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eco-Friendly Transportation Planner</title>
  <link rel="stylesheet" href="eco-friendly-transportation-planner.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css?family=Montserrat:400,700&display=swap" rel="stylesheet">
</head>
<body>
  <header>
    <h1>Eco-Friendly Transportation Planner</h1>
    <p>Choose sustainable transportation options, calculate emissions saved, and find local routes or transit schedules!</p>
  </header>
  <section class="planner-section">
    <h2>Plan Your Trip</h2>
    <form id="tripForm">
      <input type="text" id="startLocation" placeholder="Start Location" required>
      <input type="text" id="endLocation" placeholder="End Location" required>
      <select id="transportOption" required>
        <option value="bike">Bike</option>
        <option value="public">Public Transit</option>
        <option value="carpool">Carpool</option>
        <option value="walk">Walk</option>
      </select>
      <button type="submit">Plan Trip</button>
    </form>
  </section>
  <section class="results-section">
    <h2>Trip Results</h2>
    <div id="tripResults"></div>
  </section>
  <section class="routes-section">
    <h2>Local Routes & Transit Schedules</h2>
    <div id="routesInfo"></div>
  </section>
  <script src="eco-friendly-transportation-planner.js"></script>
</body>
</html>
