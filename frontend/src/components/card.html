<template id="animal-card-template">
  <article class="animal-card" tabindex="0" aria-labelledby="name-{{id}}">
    <div class="card-img-wrap">
      <img class="card-img" src="{{img}}" alt="Photo of {{name}} the {{species}}">
    </div>
    <div class="card-body">
      <h3 id="name-{{id}}" class="card-title">{{name}}</h3>
      <p class="card-meta">{{species}} • {{age}} • {{location}}</p>
      <p class="card-desc">{{description}}</p>
      <div class="card-actions">
        <button class="btn btn-outline btn-view" data-id="{{id}}">View</button>
        <button class="btn btn-primary btn-adopt" data-id="{{id}}">Adopt</button>
      </div>
    </div>
  </article>
</template>
