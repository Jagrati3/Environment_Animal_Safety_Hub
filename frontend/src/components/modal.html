<template id="animal-modal-template">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-backdrop" data-close></div>
    <div class="modal-panel">
      <header class="modal-header">
        <h2 id="modal-title">{{name}}</h2>
        <button class="modal-close" aria-label="Close" data-close>&times;</button>
      </header>
      <div class="modal-content">
        <div class="modal-grid">
          <img class="modal-img" src="{{img}}" alt="Photo of {{name}}">
          <div class="modal-body">
            <p class="modal-meta">{{species}} • {{age}} • {{sex}} • {{location}}</p>
            <p class="modal-desc">{{description}}</p>
            <div class="modal-actions">
              <button class="btn btn-primary btn-adopt" data-id="{{id}}">I want to adopt</button>
              <a class="btn btn-link" href="mailto:adoptions@example.org?subject=Adoption%20Interest%20-%20{{name}}&body=Hi%20team%2C%0A%0AI%27m%20interested%20in%20adopting%20{{name}}%20(id%3A%20{{id}}).%20Please%20let%20me%20know%20the%20next%20steps.%0A%0AThanks%2C" target="_blank">Contact shelter</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</template>
