<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pet Adoption</title>
  <link rel="stylesheet" href="../css/global/layout.css">
  <link rel="stylesheet" href="../css/pages/adoption.css">
</head>
<body>
  <main class="container adoption-page">
    <header class="adoption-header">
      <h1>Find your new companion</h1>
      <p class="lead">Browse animals available for adoption. Click <strong>View</strong> to see details or <strong>Adopt</strong> to start the process.</p>
      <div class="controls">
        <input id="search" type="search" placeholder="Search by name, species or location" aria-label="Search animals">
        <select id="filter-species" aria-label="Filter by species">
          <option value="">All species</option>
          <option>Dog</option>
          <option>Cat</option>
          <option>Rabbit</option>
        </select>
      </div>
    </header>

    <section id="animal-list" class="animal-list" aria-live="polite"></section>

    <div id="no-results" class="no-results" hidden>No animals match your search.</div>

    <!-- component templates will be fetched and injected by JS -->
    <div id="component-templates" hidden></div>
  </main>

  <script src="../js/pages/adoption.js" type="module"></script>
</body>
</html>
